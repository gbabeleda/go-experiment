services:
  go-api:
    container_name: go-api
    image: ${REGISTRY_IMAGE_API}
    ports:
      - 8080:8080
    env_file:
      - .env
    restart: always
    stop_grace_period: 60s
    # cpus: "0.5"
    # mem_limit: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  go-worker:
    container_name: go-worker
    image: ${REGISTRY_IMAGE_WORKER}
    env_file:
      - .env
    restart: always
    stop_grace_period: 60s
    # cpus: "0.5"
    # mem_limit: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
