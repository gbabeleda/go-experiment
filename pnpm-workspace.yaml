# Only frontend/* is globbed. `backend/` at the repo root is the go workspace and is not declared here.
packages:
  - "frontend/*"

allowBuilds:
  sharp: false
  unrs-resolver: false

catalog:
  '@tailwindcss/postcss': ^4.3.3
  '@types/node': ^20.19.43
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  eslint: ^9.39.5
  eslint-config-next: 16.3.6
  next: 16.3.6
  prettier: ^3.9.9
  prettier-plugin-tailwindcss: ^0.8.1
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: ^4.3.3
  typescript: ^5.9.3
